name: Compilar y publicar

# Compila este programa (C#, .NET 8) como UN ÚNICO .exe autocontenido para
# Windows y lo publica en un "release" de GitHub, para que mtgcorner.com pueda
# enlazarlo directamente.
#
# UN .EXE Y NO UN ZIP. Hasta el 2026-09-15 el paquete llevaba al lado
# mtga-tracker-daemon con sus doscientos ficheros, y de ahí salieron los fallos
# reales: abrir el .exe DENTRO del zip (Windows saca sólo ese fichero a una
# carpeta temporal y el lector se queda dentro), un puerto ocupado, una consola
# anterior sin cerrar. Ahora el lector va compilado dentro del programa
# (vendor/HackF5.UnitySpy) y se publica un fichero suelto: nada que
# descomprimir, nada que tenga que estar al lado.
#
# POR QUÉ UN RELEASE Y NO UN ARTEFACTO DE ACTIONS: un artefacto exige estar
# identificado en GitHub para descargarlo — inútil para un enlace en una web
# pública. Un release de un repositorio PÚBLICO no.
#
# POR QUÉ SIEMPRE LA MISMA ETIQUETA ("latest"): así el enlace de la web no
# cambia nunca, aunque este programa se recompile.
#
# LA LICENCIA VIAJA CON EL BINARIO: el texto de la GPLv3 va embebido en el
# propio .exe (`--licencia` lo deja al lado) y además se sube al release como
# fichero aparte.

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write # hace falta para crear el release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Con historial: el paso de publicar mueve la etiqueta `latest` al
          # commit de hoy con `git tag -f`, y para eso hace falta el repositorio
          # de verdad, no una copia sin pasado.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compilar, autocontenido y en un solo fichero
        shell: pwsh
        run: |
          dotnet publish -c Release -r win-x64 -p:SelfContained=true -p:PublishSingleFile=true -o dist
          if ($LASTEXITCODE -ne 0) { throw "no compiló MtgCornerArenaBridge" }
          if (-not (Test-Path dist/MtgCornerArenaBridge.exe)) { throw "no se generó MtgCornerArenaBridge.exe" }
          $mb = [math]::Round((Get-Item dist/MtgCornerArenaBridge.exe).Length / 1MB, 1)
          Write-Host "MtgCornerArenaBridge.exe: $mb MB"

      # El lector de memoria es justo lo que un antivirus mira con lupa, así que
      # se publican las huellas del fichero: quien dude puede comprobar que lo
      # que se descargó es lo que salió de aquí.
      - name: Huella del ejecutable
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/MtgCornerArenaBridge.exe -Algorithm SHA256).Hash
          "$h  MtgCornerArenaBridge.exe" | Out-File -Encoding utf8 dist/SHA256.txt
          Write-Host $h
          Copy-Item LICENSE dist/LICENCIA-GPLv3.txt

      # La versión sale del .csproj, que es el único sitio donde se escribe.
      - name: Leer la versión
        id: version
        shell: pwsh
        run: |
          $v = ([xml](Get-Content MtgaCompanion.csproj)).Project.PropertyGroup.Version | Where-Object { $_ }
          if (-not $v) { throw "MtgaCompanion.csproj no declara <Version>" }
          $v = "$v".Trim()
          Write-Host "versión: $v"
          "version=$v" | Out-File -Encoding utf8 -Append $env:GITHUB_OUTPUT
          Copy-Item dist/MtgCornerArenaBridge.exe "dist/MtgCornerArenaBridge-$v.exe"

      # DOS RELEASES, Y CADA UNO PARA UNA COSA.
      #
      #  · `latest` — etiqueta móvil, nombre de fichero fijo. Es la que enlaza
      #    el botón de la web, y por eso no puede cambiar nunca de nombre.
      #  · `v<versión>` — inmutable. Da una URL distinta por versión, que es lo
      #    que permite que el navegador cachee la descarga y que el propio
      #    programa sepa si lo que hay fuera es lo que ya tiene (ComprobarVersion
      #    en Program.cs). Sin esto, "latest" apuntaba a un fichero cambiante y
      #    nadie podía distinguir una versión de otra.
      #
      # El versionado NO SE BORRA Y SE VUELVE A CREAR como `latest`: si ya
      # existe, se deja como está y sólo se avisa. Machacarlo cambiaría, bajo
      # una etiqueta que alguien ya enlazó, un binario distinto.
      - name: Publicar el release versionado
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          if (gh release view "v$v" 2>$null) {
            Write-Host "::warning::v$v ya está publicado; no se toca. Sube <Version> en el .csproj al cambiar el programa."
          } else {
            gh release create "v$v" "dist/MtgCornerArenaBridge-$v.exe" dist/LICENCIA-GPLv3.txt dist/SHA256.txt `
              --title "Importar de MTG Arena v$v" `
              --notes "Versión $v. Un único .exe, sin instalar nada: lee tu colección, tus mazos y tus comodines de MTG Arena y los sube a tu cuenta para que elijas qué guardar. GPLv3 — el código está en este repositorio e incluye, en vendor/, el lector de memoria de mtga-tracker-daemon (frcaton). SHA256 en SHA256.txt."
          }

      # EL RELEASE "latest" NO SE BORRA: SE LE CAMBIAN LOS FICHEROS.
      #
      # Antes se borraba y se volvía a crear en cada publicación. Dos veces en
      # un mismo día (2026-09-24) eso dejó el enlace de descarga de la web en
      # 404: `gh release create` crea el release como BORRADOR, sube los
      # ficheros y lo publica al final, y si ese último paso no llega —la
      # etiqueta recién borrada aún no había desaparecido del todo— se queda un
      # borrador que la URL pública no sirve. Y mientras dura el borrado,
      # cualquiera que pulse «Descargar» se lleva un 404.
      #
      # Ahora el release vive siempre: se sustituyen sus tres ficheros
      # (`--clobber`), se mueve la etiqueta al commit de hoy y se actualizan las
      # notas. Sólo si no existe —el primer día, o si alguien lo borró a mano—
      # se crea. Y se COMPRUEBA al final que la URL que enlaza la web responde:
      # una publicación que deja el enlace roto tiene que fallar en rojo, no
      # acabar en verde.
      - name: Publicar en el release "latest"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $notas = "Versión $v. Un único .exe, sin instalar nada: lee tu colección, tus mazos y tus comodines de MTG Arena y los sube a tu cuenta para que elijas qué guardar. Se recompila en cada cambio; esta etiqueta apunta siempre a la última. GPLv3 — el código está en este repositorio e incluye, en vendor/, el lector de memoria de mtga-tracker-daemon (frcaton). SHA256 en SHA256.txt."
          if (gh release view latest 2>$null) {
            gh release upload latest dist/MtgCornerArenaBridge.exe dist/LICENCIA-GPLv3.txt dist/SHA256.txt --clobber
            gh release edit latest --draft=false --prerelease=false --title "Importar de MTG Arena" --notes $notas
          } else {
            gh release create latest dist/MtgCornerArenaBridge.exe dist/LICENCIA-GPLv3.txt dist/SHA256.txt `
              --title "Importar de MTG Arena" --notes $notas
          }
          # La etiqueta, al commit de hoy: el release ya existía y apuntaba al anterior.
          git tag -f latest
          git push --force origin latest

      - name: Comprobar que el enlace de la web descarga la versión de hoy
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $url = "https://github.com/${{ github.repository }}/releases/download/latest/MtgCornerArenaBridge.exe"
          $ok = $false
          foreach ($intento in 1..12) {
            try {
              $r = Invoke-WebRequest -Uri $url -Method Head -MaximumRedirection 5 -ErrorAction Stop
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            Start-Sleep -Seconds 10
          }
          if (-not $ok) { Write-Host "::error::$url sigue sin responder 200 dos minutos después de publicar: el botón de descargar de la web está roto."; exit 1 }
          Write-Host "Descarga en marcha: $url (v$v)"
